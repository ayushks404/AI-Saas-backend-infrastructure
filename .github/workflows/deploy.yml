name: Deploy AI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # 1. CI QUALITY GATE (Must pass to allow deploy)
  # ==========================================
  ci:
    name: CI Typecheck & Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Deterministic Dependency Install
        run: npm ci

      - name: Static Type Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Automated Tests
        run: npm test

  # ==========================================
  # 2. DEPLOYMENT PIPELINE (Gated by 'needs: ci')
  # ==========================================
  deploy:
    name: Production SSH Deploy & Zero-Downtime Reload
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deploy Script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /app/ai-backend
            git pull origin main
            npm ci --omit=dev
            npm run build
            pm2 reload ai-backend --update-env
            pm2 list

      - name: Health Check Deployment Gate
        run: |
          sleep 15
          curl --fail --retry 3 --retry-delay 5 https://${{ secrets.SERVER_HOST }}/health/ready || exit 1
