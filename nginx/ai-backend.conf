upstream node_backend {
    server 127.0.0.1:3000;
    keepalive 32;  # Persistent connection pool to Node.js cluster
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # SSL certificates managed via Let's Encrypt / Certbot
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 1. Standard REST API endpoints
    location / {
        proxy_pass         http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 2. SSE streaming endpoints - MUST disable buffering
    location ~ ^/api/ai/(chat|stream|compare) {
        proxy_pass         http://node_backend;
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# 3. HTTP to HTTPS 301 redirection
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
